{{- if .Values.ssl.cert_manager.enabled }}
{{- $cm := .Values.ssl.cert_manager | default dict }}
{{- $dns01 := $cm.dns01 | default dict }}
{{- $r53 := $dns01.route53 | default dict }}
{{- if not $cm.email }}
{{- fail "ssl.cert_manager.email is required when cert-manager is enabled" }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ $cm.email }}
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - dns01:
        route53:
          region: {{ $r53.region | default "us-east-1" }}
{{- if $r53.hosted_zone_id }}
          hostedZoneID: {{ $r53.hosted_zone_id }}
{{- end }}
          accessKeyID: {{ $r53.access_key_id }}
          secretAccessKeySecretRef:
            name: route53-credentials
            key: secret-access-key
{{- end }}

